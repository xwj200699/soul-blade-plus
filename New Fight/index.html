<script>
'use strict';
/* ============================================================
   超·血刃大乱戦 CRIMSON BRAWL — Q版格斗 DEMO (单文件, 全程序化美术)
   结构参照实测视频: 三层logo标题+爆炸演出 → 双列选人+两侧大立绘
   +搞笑称号+SELECT! → ROUND/99秒/双血条武道会战斗
   角色: 血刃七人花名册中的六人 Q 版重绘 (原创程序化像素)
   ============================================================ */
const CV = document.getElementById('game');
const CX = CV.getContext('2d');
CX.imageSmoothingEnabled = false;
const W = 1024, H = 576;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

/* ================= Input ================= */
const Input = (() => {
  const down = {}, hit = {}, dtap = {}, lastT = {};
  addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if (!down[e.code]) {
      hit[e.code] = true;
      const now = performance.now();
      if (now - (lastT[e.code] || -9e9) < 240) dtap[e.code] = true;  // 双击检测(冲刺)
      lastT[e.code] = now;
    }
    down[e.code] = true;
    Aud.unlock();
  });
  addEventListener('keyup', e => { down[e.code] = false; });
  return {
    down: c => !!down[c],
    hit: c => { const v = !!hit[c]; hit[c] = false; return v; },
    dtap: c => { const v = !!dtap[c]; dtap[c] = false; return v; },
    flush: () => { for (const k in hit) hit[k] = false; for (const k in dtap) dtap[k] = false; },
  };
})();

/* ================= Audio (WebAudio 迷你合成器) ================= */
const Aud = (() => {
  let ac = null, master = null;
  const unlock = () => {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    } catch (e) {}
  };
  const tone = (f0, f1, dur, type, vol, delay) => {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  };
  const noise = (dur, vol, hp, delay) => {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || 900;
    const g = ac.createGain(); g.gain.value = vol || 0.2;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t);
  };
  return {
    unlock,
    blip: () => tone(520, 700, 0.06, 'square', 0.12),
    confirm: () => { tone(620, 930, 0.1, 'square', 0.16); tone(930, 1240, 0.12, 'square', 0.14, 0.08); },
    cancel: () => tone(400, 180, 0.12, 'square', 0.14),
    gong: () => { tone(196, 190, 0.9, 'triangle', 0.35); tone(392, 380, 0.7, 'sine', 0.2); noise(0.25, 0.1, 2200); },
    hit: () => { noise(0.09, 0.3, 1400); tone(300, 120, 0.08, 'square', 0.2); },
    hit2: () => { noise(0.14, 0.35, 900); tone(220, 70, 0.14, 'sawtooth', 0.24); },
    ko: () => { tone(520, 60, 0.7, 'sawtooth', 0.3); noise(0.5, 0.3, 500); },
    whoosh: () => noise(0.12, 0.16, 3000),
    fanfare: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.18, 'square', 0.16, i * 0.12)); },
  };
})();

/* ================= Q版角色定义 (血刃花名册 · 原创Q版重绘) ================= */
const OUT = '#221626';

/* ================= 帧数据表 (JSON 数据驱动, 可整体迁往引擎) =================
   startup/active/rec: 发生/持续/收招帧 · dmg: 伤害 · stun/bstun: 受击/防御硬直
   push: 命中推距 · hs: hitstop 停帧 · level: high(可蹲避)/mid · range: 判定距
   cancel: 命中后可取消进的招 · knockdown: 击倒 */
const BASE_MOVES = {

/* 每人差异化: 帧数据微调 + 专属必杀(U) + 超必杀(I)模板
   sp.type: proj(投射物)/beam(激光束)/lunge(突进)/sweep(横扫·霸体)
   super.style: rush(乱舞)/beam(巨束)/storm(风暴)/slam(轰坠) */
const KIT = {
  mack:     { mod: {}, walk: 3.1,
    sp: { type: 'proj', startup: 13, active: 4, rec: 20, name: '斩月剑波', proj: { kind: 'wave', spd: 3.6, dmg: 12, stun: 20, life: 70, w: 30, h: 34 } },
    super: { style: 'rush', name: '无想·连刃', dmg: 30 } },
  ayame:    { mod: { light: { startup: 4, dmg: 6, rec: 8 }, heavy: { startup: 8, dmg: 11 } }, walk: 3.7,
    sp: { type: 'proj', startup: 9, active: 3, rec: 15, name: '手裏剑', proj: { kind: 'kunai', spd: 7.5, dmg: 8, stun: 15, life: 90, w: 24, h: 10 } },
    super: { style: 'rush', name: '疾风·八重樱', dmg: 27 } },
  kuro:     { mod: { heavy: { dmg: 14 } }, walk: 3.3,
    sp: { type: 'lunge', startup: 10, active: 8, rec: 16, name: '影袭', dmg: 11, stun: 20, lungeV: 9 },

    super: { style: 'slam', name: '如意·镇天棍', dmg: 30 } },
  angela:   { mod: { light: { dmg: 6 }, heavy: { dmg: 11 } }, walk: 2.9,

    super: { style: 'storm', name: '花舞·乱影', dmg: 30 } },
};
function moveOf(cid, key) {
  const base = BASE_MOVES[key], mod = (KIT[cid].mod || {})[key];
  return mod ? Object.assign({}, base, mod) : base;
}

/* ================= Q版烘焙器 (48x56 像素网格) ================= */
const Baker = (() => {
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const shade = (hex, f) => { // 简易明度缩放
    const n = parseInt(hex.slice(1), 16);
    const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = clamp((n & 255) * f, 0, 255) | 0;
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  };

  /* ============ 玩偶级矢量烘焙管线 ============
     192x224 矢量绘制(真椭圆/胶囊/贝塞尔) → 96x112 降采样 → 调色板量化
     三色阶材质 ramp + 有色描边 + 球体着色(高光/阴影月牙), 对齐参考视频质感 */
  const TAU = Math.PI * 2;
  const mix = (h1, h2) => {
    const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    const r = (((a >> 16 & 255) + (b >> 16 & 255)) / 2) | 0, gg = (((a >> 8 & 255) + (b >> 8 & 255)) / 2) | 0, bl = (((a & 255) + (b & 255)) / 2) | 0;
    return '#' + ((1 << 24) + (r << 16) + (gg << 8) + bl).toString(16).slice(1);
  };
  const ramp = hex => ({ b: hex, s: shade(hex, 0.76), h: shade(hex, 1.2), o: shade(hex, 0.4) });
  function quantize(cv, palHex) {
    const g = cv.getContext('2d');
    const im = g.getImageData(0, 0, cv.width, cv.height), d = im.data;
    const pal = palHex.map(h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; });
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 112) { d[i + 3] = 0; continue; }
      d[i + 3] = 255;
      let bi = 0, bd = 1e9;
      for (let p = 0; p < pal.length; p++) {
        const dr = d[i] - pal[p][0], dg = d[i + 1] - pal[p][1], db = d[i + 2] - pal[p][2];
        const dist = dr * dr + dg * dg + db * db;
        if (dist < bd) { bd = dist; bi = p; }
      }
      d[i] = pal[bi][0]; d[i + 1] = pal[bi][1]; d[i + 2] = pal[bi][2];
    }
    g.putImageData(im, 0, 0);
  }
  function charPalette(c, R) {
    const pal = new Set(['#ffffff', '#241d2e', '#ffb3c0', '#8f3348', '#3a3140', '#565064',
      '#cfd8e3', '#e8b23a', '#ffd97a', '#d43a2f', '#7fd3ff', '#ff5d73', '#ff8298', '#f2f2f2', '#a05a6a']);
    for (const k in R) { const r = R[k]; pal.add(r.b); pal.add(r.s); pal.add(r.h); pal.add(r.o);
      pal.add(mix(r.b, r.s)); pal.add(mix(r.b, r.h)); }               // 色阶间过渡色(手绘AA感)
    pal.add(c.eye); pal.add(shade(c.eye, 0.62)); pal.add(mix(c.skin, '#ffb3c0'));
    return [...pal];
  }

  /* pose: idle0 idle1 walk0 walk1 atk atk2 hurt ko win crouch block */
  function bakePose(c, pose, fr) {
    const hi = mk(192, 224), v = hi.getContext('2d');
    const R = { skin: ramp(c.skin), hair: ramp(c.hair), c1: ramp(c.c1), c2: ramp(c.c2), acc: ramp(c.acc) };
    /* --- 矢量基元 --- */
    const EL = (x, y, rx, ry, fill, out, ow, rot) => {
      v.beginPath(); v.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
      if (fill) { v.fillStyle = fill; v.fill(); }
      if (out) { v.strokeStyle = out; v.lineWidth = ow || 4; v.stroke(); }
    };
    const CAPS = (x1, y1, x2, y2, w, fill, out) => {          // 胶囊肢体
      v.lineCap = 'round';
      if (out) { v.strokeStyle = out; v.lineWidth = w + 5; v.beginPath(); v.moveTo(x1, y1); v.lineTo(x2, y2); v.stroke(); }
      v.strokeStyle = fill; v.lineWidth = w; v.beginPath(); v.moveTo(x1, y1); v.lineTo(x2, y2); v.stroke();
    };
    const CRE = (x, y, rx, ry, dx, dy, col) => {              // 月牙阴影(主椭圆内减去偏移椭圆)
      v.save(); v.beginPath(); v.ellipse(x, y, rx, ry, 0, 0, TAU); v.clip();
      v.beginPath(); v.ellipse(x + dx, y + dy, rx, ry, 0, 0, TAU);
      v.rect(x - rx - 12, y - ry - 12, rx * 2 + 24, ry * 2 + 24);
      v.fillStyle = col; v.fill('evenodd'); v.restore();
    };
    const ARC = (x, y, r, a0, a1, w, col) => { v.beginPath(); v.arc(x, y, r, a0, a1); v.strokeStyle = col; v.lineWidth = w; v.lineCap = 'round'; v.stroke(); };
    const T = { EL, CAPS, CRE, ARC, v, R };

    if (pose === 'ko') { bakeKO(c, T); return finish(); }
    const crouch = pose === 'crouch';
    const atk = pose === 'atk' || pose === 'atk2';
    const bob = ((pose === 'idle' && fr === 1) || pose === 'win' ? 4 : 0) + (crouch ? 38 : 0);
    const HX = 96, HY = 64 + bob;                             // 头心
    drawHairBack(c, T, HX, HY);

    /* ---- 腿/鞋 ---- */
    let l1 = 0, l2 = 0;
    if (pose === 'walk') { l1 = fr ? -7 : 3; l2 = fr ? 3 : -7; }
    const pantC = c.girl ? '#f2f2f2' : R.c2.b, pantO = c.girl ? '#565064' : R.c2.o;
    if (crouch) {
      EL(74, 206, 17, 9, '#3a3140', '#241d2e', 4); EL(118, 206, 17, 9, '#3a3140', '#241d2e', 4);
      EL(69, 202, 6, 3, '#565064'); EL(113, 202, 6, 3, '#565064');
    } else {
      CAPS(82, 176 + l1, 80, 194 + l1, 16, pantC, pantO);
      CAPS(110, 176 + l2, 112, 194 + l2, 16, pantC, pantO);
      EL(79, 206 + l1 * 0.5, 16, 8.5, '#3a3140', '#241d2e', 4);
      EL(113, 206 + l2 * 0.5, 16, 8.5, '#3a3140', '#241d2e', 4);
      EL(74, 202 + l1 * 0.5, 6, 3, '#565064'); EL(108, 202 + l2 * 0.5, 6, 3, '#565064');
    }

    /* ---- 躯干 ---- */
    const BY = 148 + bob;
    if (c.girl) {
      /* 喇叭裙 + 褶影 + 白摆边 */
      v.beginPath();
      v.moveTo(74, BY - 12);
      v.quadraticCurveTo(62, BY + 16, 52, BY + 28);
      v.quadraticCurveTo(96, BY + 44, 140, BY + 28);
      v.quadraticCurveTo(130, BY + 16, 118, BY - 12);
      v.closePath();
      v.fillStyle = R.c1.b; v.fill();
      v.strokeStyle = R.c1.o; v.lineWidth = 4.5; v.stroke();
      for (const px of [76, 96, 116]) {                        // 裙褶阴影
        v.beginPath(); v.moveTo(px, BY - 6); v.lineTo(px - 5, BY + 27); v.lineTo(px + 5, BY + 27); v.closePath();
        v.fillStyle = R.c1.s; v.fill();
      }
      v.beginPath(); v.moveTo(53, BY + 27); v.quadraticCurveTo(96, BY + 42, 139, BY + 27);
      v.strokeStyle = c.id === 'angela' ? '#7a9ee0' : '#ffffff'; v.lineWidth = 7; v.stroke();  // 摆边(白裙角色用蓝)
      EL(96, BY - 14, 25, 17, R.c1.b, R.c1.o, 4.5);            // 上身
      CRE(96, BY - 14, 25, 17, -7, -8, R.c1.s);
      EL(96, BY - 2, 20, 6, R.acc.b, R.acc.o, 3.5);            // 腰带
      EL(86, BY - 22, 8, 5, R.c1.h);                           // 高光
    } else {
      EL(96, BY, 33, 28, R.c1.b, R.c1.o, 4.5);
      CRE(96, BY, 33, 28, -9, -10, R.c1.s);
      v.save(); v.beginPath(); v.ellipse(96, BY, 33, 28, 0, 0, TAU); v.clip();
      v.fillStyle = R.c2.b; v.fillRect(60, BY + 16, 72, 14);   // 下摆
      v.fillStyle = R.acc.b; v.fillRect(60, BY + 8, 72, 9);    // 腰带
      v.restore();
      EL(96, BY + 12.5, 4.5, 4.5, R.acc.h);                    // 腰扣
      EL(82, BY - 14, 10, 6.5, R.c1.h);                        // 高光
    }

    /* ---- 头 (大圆 + 球体着色) ---- */
    EL(HX, HY, 52, 46, R.skin.b, R.skin.o, 5);
    CRE(HX, HY, 52, 46, -10, -13, R.skin.s);                   // 右下阴影月牙
    EL(HX - 20, HY - 22, 18, 11, R.skin.h);                    // 左上高光
    drawFace(c, T, HX, HY, pose);
    drawHairFront(c, T, HX, HY, pose);

    /* ---- 手臂 (胶囊 + 圆手) ---- */
    const AY = 132 + bob, armC = R.c1.s, armO = R.c1.o;
    const arm = (sx, sy, hx2, hy2) => {
      CAPS(sx, sy, hx2, hy2, 15, armC, armO);
      EL(hx2, hy2, 10, 10, R.skin.b, R.skin.o, 3.5);
      EL(hx2 - 3, hy2 - 3, 3.5, 3, R.skin.h);
    };
    if (atk) {
      arm(62, AY + 2, 46, AY + 16);
      arm(128, AY - 4, 158, AY + 2);
    } else if (pose === 'block') {
      arm(120, AY + 4, 140, AY - 10);
      arm(118, AY + 14, 142, AY + 4);
      EL(152, AY - 2, 6, 16, '#ffffff');
    } else if (pose === 'hurt') {
      arm(60, AY - 4, 44, AY - 18); arm(132, AY - 4, 148, AY - 18);
    } else if (pose === 'win') {
      arm(60, AY - 4, 44, AY - 40); arm(132, AY - 4, 148, AY - 40);
    } else {
      const sw = pose === 'walk' ? (fr ? 8 : -8) : 0;
      arm(62, AY + 2, 50 + sw, AY + 26); arm(130, AY + 2, 142 - sw, AY + 26);
    }
    drawProp(c, T, pose, AY);
    return finish();

    function finish() {
      const lo = mk(96, 112), lg = lo.getContext('2d');
      lg.imageSmoothingEnabled = true; lg.imageSmoothingQuality = 'high';
      lg.drawImage(hi, 0, 0, 96, 112);
      quantize(lo, charPalette(c, R));
      return lo;
    }
  }

  /* ---- 大眼玩偶脸 (eyesOnly: 风帽脸洞内只重绘眼部) ---- */
  function drawFace(c, T, cx, cy, pose, eyesOnly) {
    const { EL, CAPS, ARC } = T;
    const K = '#241d2e', ey = cy + 12, exL = cx - 21, exR = cx + 21;
    const bigEye = x => {
      EL(x, ey, 10, 13.5, '#ffffff', K, 3.5);
      EL(x, ey + 1.5, 7.2, 10.5, c.eye);
      EL(x, ey + 2.5, 3.6, 6, K);

  /* 头像 chip: 头部特写 36x30 */
  function bakeChip(c) {
    const full = bakePose(c, 'idle', 0);

  const bank = {};
  function bakeAll() {
    for (const c of CHARS) {
      bank[c.id] = {
        idle: [bakePose(c, 'idle', 0), bakePose(c, 'idle', 1)],
        walk: [bakePose(c, 'walk', 0), bakePose(c, 'walk', 1)],

  }
  return { bakeAll, bank };
})();

/* ================= 粒子 FX ================= */
const FX = (() => {
  let ps = [];
  const spawn = (n, fn) => { for (let i = 0; i < n; i++) ps.push(fn(i)); };
  const burst = (x, y, col) => spawn(14, () => ({
    x, y, vx: rnd(-4, 4), vy: rnd(-5, 1), g: 0.25, t: 0, life: rnd(18, 34),
    w: rnd(2, 5), col, kind: 'spark',
  }));
  const confetti = (x, y) => spawn(26, () => ({
    x: x + rnd(-30, 30), y: y + rnd(-16, 4), vx: rnd(-2.4, 2.4), vy: rnd(-6, -2), g: 0.18,
    t: 0, life: rnd(40, 78), w: rnd(3, 6),
    col: ['#ff5d73', '#ffd23e', '#59d98e', '#7fd3ff', '#c9b3ff'][(Math.random() * 5) | 0], kind: 'confetti',
  }));
  const explo = (x, y, big) => spawn(big ? 26 : 12, () => {
    const a = rnd(0, Math.PI * 2), sp = rnd(0.5, big ? 5 : 2.6);
    return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.72 - 0.4, g: -0.01, t: 0,
      life: rnd(26, 60), w: rnd(3, big ? 12 : 7), kind: 'fire' };
  });
  const update = () => {
    for (const p of ps) { p.t++; p.x += p.vx; p.y += p.vy; p.vy += p.g; }
    ps = ps.filter(p => p.t < p.life);
  };
  const draw = g => {
    for (const p of ps) {
      const k = 1 - p.t / p.life;
      if (p.kind === 'fire') {
        g.globalAlpha = k * 0.9;
        g.fillStyle = k > 0.6 ? '#fff3c4' : k > 0.3 ? '#ffb23e' : '#c9401e';
        g.fillRect(p.x - p.w * k / 2, p.y - p.w * k / 2, p.w * k, p.w * k);
      } else if (p.kind === 'confetti') {
        g.globalAlpha = Math.min(1, k * 2);
        g.fillStyle = p.col;
        g.fillRect(p.x, p.y, p.w, p.w * 0.6 + Math.sin((p.t + p.x) * 0.4) * p.w * 0.4);
      } else {
        g.globalAlpha = k;
        g.fillStyle = p.col;
        g.fillRect(p.x - p.w / 2, p.y - p.w / 2, p.w, p.w);
      }
    }
    g.globalAlpha = 1;
  };
  return { burst, confetti, explo, update, draw, clear: () => { ps = []; } };
})();

})();

const FONT_EN = '"Arial Black","Segoe UI",sans-serif';
const FONT_CN = '"Microsoft YaHei","PingFang SC",sans-serif';
function outlineText(g, txt, x, y, font, fill, stroke, sw, italic) {
  g.save();
  /* 绕锚点斜切, 坐标系保持绝对 (渐变取色才正确) */
  if (italic) { g.translate(x, y); g.transform(1, 0, -0.14, 1, 0, 0); g.translate(-x, -y); }
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  if (stroke) { g.lineJoin = 'round'; g.strokeStyle = stroke; g.lineWidth = sw || 6; g.strokeText(txt, x, y); }
  if (typeof fill === 'function') g.fillStyle = fill(g); else g.fillStyle = fill;
  g.fillText(txt, x, y);
  g.restore();
}
const gradMetal = (g, y0, y1) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.42, '#dfe8f2'); gr.addColorStop(0.52, '#5f7086'); gr.addColorStop(0.66, '#b9c4d4'); gr.addColorStop(1, '#f5f8fc'); return gr; };
const gradFire = (g, y0, y1) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, '#ffd97a'); gr.addColorStop(0.16, '#ff8a2a'); gr.addColorStop(0.32, '#e02f1e'); gr.addColorStop(0.85, '#a3121a'); gr.addColorStop(1, '#70090f'); return gr; };

/* ================= 选人画面 ================= */
const Select = (() => {
  /* 网格 2列x3行 */
  const COLS = 2, ROWS = 3;
  const CW = 96, CH = 74, GX = 512 - (COLS * CW + 14) / 2, GY = 176;
  const cellRect = i => ({ x: GX + (i % COLS) * (CW + 14), y: GY + ((i / COLS) | 0) * (CH + 12), w: CW, h: CH });
  const st = { p1: 0, p2: 1, c1: false, c2: false, cpuT: 0, doneT: 0 };
  function enter() {
    st.p1 = 0; st.p2 = 1; st.c1 = false; st.c2 = false; st.cpuT = 0; st.doneT = 0;
    FX.clear();
  }
  function moveCursor(cur, dx, dy) {
    let cx = cur % COLS, cy = (cur / COLS) | 0;
    cx = (cx + dx + COLS) % COLS; cy = (cy + dy + ROWS) % ROWS;
    return cy * COLS + cx;
  }
  function update() {
    if (!st.c1) {
      let m = null;
      if (Input.hit('KeyA')) m = [-1, 0]; else if (Input.hit('KeyD')) m = [1, 0];
      else if (Input.hit('KeyW')) m = [0, -1]; else if (Input.hit('KeyS')) m = [0, 1];
      if (m) { st.p1 = moveCursor(st.p1, m[0], m[1]); Aud.blip(); }
      if (Input.hit('KeyJ') || Input.hit('Space')) {
        st.c1 = true; Aud.confirm();
        const r = cellRect(st.p1); FX.confetti(r.x + r.w / 2, r.y);
      }
      if (Input.hit('Escape')) { Aud.cancel(); Title.enter(true); G.screen = 'title'; return; }
    }
    if (G.mode === 'vs') {
      if (!st.c2) {
        let m = null;
        if (Input.hit('ArrowLeft')) m = [-1, 0]; else if (Input.hit('ArrowRight')) m = [1, 0];
        else if (Input.hit('ArrowUp')) m = [0, -1]; else if (Input.hit('ArrowDown')) m = [0, 1];
        if (m) { st.p2 = moveCursor(st.p2, m[0], m[1]); Aud.blip(); }
        if (Input.hit('Comma') || Input.hit('Numpad1')) {
          st.c2 = true; Aud.confirm();
          const r = cellRect(st.p2); FX.confetti(r.x + r.w / 2, r.y);
        }
      }
    } else if (G.mode === 'training') {
      /* TRAINING: 1P 确认后继续用 WASD+J 选木桩 */
      if (st.c1 && !st.c2) {
        let m = null;
        if (Input.hit('KeyA')) m = [-1, 0]; else if (Input.hit('KeyD')) m = [1, 0];
        else if (Input.hit('KeyW')) m = [0, -1]; else if (Input.hit('KeyS')) m = [0, 1];
        if (m) { st.p2 = moveCursor(st.p2, m[0], m[1]); Aud.blip(); }
        if (Input.hit('KeyJ') || Input.hit('Space')) {
          st.c2 = true; Aud.confirm();
          const r = cellRect(st.p2); FX.confetti(r.x + r.w / 2, r.y);
        }
      }
    } else if (st.c1 && !st.c2) {
      /* ARCADE: CPU 随机跑马灯选首个对手 */
      st.cpuT++;
      if (st.cpuT < 46) { if (st.cpuT % 5 === 0) { st.p2 = (Math.random() * CHARS.length) | 0; Aud.blip(); } }
      else { st.c2 = true; Aud.confirm(); const r = cellRect(st.p2); FX.confetti(r.x + r.w / 2, r.y); }
    }
    if (st.c1 && st.c2) {
      st.doneT++;
      if (st.doneT > 55) {

        if (G.mode === 'arcade') {
          /* 五人梯队: 首战=CPU跑马灯所选, 其余四人洗牌, 难度递增 */
          const rest = CHARS.map((_, i) => i).filter(i => i !== st.p1 && i !== st.p2);
          for (let i = rest.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [rest[i], rest[j]] = [rest[j], rest[i]]; }
          opt.ladder = { order: [st.p2, ...rest.slice(0, 4)], idx: 0, tiers: ['easy', 'easy', 'normal', 'normal', 'hard'] };

    outlineText(g, 'PLAYER  SELECT', 512, 120, `bold 40px ${FONT_EN}`, (gg => { const t = gg.createLinearGradient(0, 84, 0, 124); t.addColorStop(0, '#f6ff6e'); t.addColorStop(1, '#59d96e'); return t; })(g), '#1b1420', 10, true);
    /* 网格 */
    for (let i = 0; i < CHARS.length; i++) {
      const r = cellRect(i), c = CHARS[i], bank = Baker.bank[c.id];

      /* 光标框 */

      if (mine2) { g.strokeStyle = st.c2 ? '#ffd75e' : '#ffab3e'; g.lineWidth = 4; g.strokeRect(r.x + (mine1 ? 2 : -2), r.y + (mine1 ? 2 : -2), r.w - (mine1 ? 4 : -4), r.h - (mine1 ? 4 : -4)); outlineText(g, '2P', r.x + r.w - 12, r.y + 16, `bold 13px ${FONT_EN}`, '#ffab3e', '#1b1420', 4); }

/* ================= 战斗画面 ================= */
const Fight = (() => {
  const GROUND = 500, SCALE = 1.5;
  let F = null;
  const cidOf = f => CHARS[f.ci].id;
  function mkFighter(ci, x, face, human) {
    return { ci, x, y: 0, vy: 0, jvx: 0, hp: 100, meter: 0, face, st: 'idle', t: 0, human,
      wins: 0, move: null, mv: null, hitDone: false, hitLanded: false, airAtkUsed: false,
      stun: 0, inv: 0, combo: 0, aiT: 0, aiMove: 0, aiGuard: 0, flash: 0, armor: false,
      aiTier: 'normal', dummy: false, noHitT: 0 };
  }
  function enter(c1, c2, opt) {
    opt = opt || {};
    F = {
      p: [mkFighter(c1, 320, 1, true), mkFighter(c2, 704, -1, G.mode === 'vs')],
      round: 1, phase: 'round', pt: 0, timer: 99, tt: 0, winner: -1,
      hitstop: 0, projs: [], superFx: null, dmgNums: [],
      training: G.mode === 'training', ladder: opt.ladder || null, showMoves: false,
    };
    if (F.training) { F.p[1].human = false; F.p[1].dummy = true; }
    F.p[1].aiTier = F.ladder ? F.ladder.tiers[F.ladder.idx] : 'normal';
    FX.clear(); G.shake = 0;
    Aud.gong();
  }
  /* ---- 出招 ---- */
  function startMove(f, key) {
    const kit = KIT[cidOf(f)];
    if (key === 'special') {
      const sp = kit.sp;
      f.mv = { startup: sp.startup, active: sp.active, rec: sp.rec, dmg: sp.dmg || 0, stun: sp.stun || 18,
        bstun: 12, push: 16, hs: 9, level: 'mid', range: sp.range || 90, cancel: ['super'],
        knockdown: !!sp.knockdown, chip: 2, spType: sp.type, proj: sp.proj, lungeV: sp.lungeV };
      f.armor = !!sp.armor;
    } else f.mv = moveOf(cidOf(f), key);
    f.st = 'attack'; f.move = key; f.t = 0; f.hitDone = false; f.hitLanded = false;
    Aud.whoosh();
  }
  function startSuper(f, o) {
    f.meter = 0;
    const kit = KIT[cidOf(f)];
    F.superFx = { u: f, o, style: kit.super.style, name: kit.super.name, dmg: kit.super.dmg, t: 0, hits: 0 };
    f.st = 'super'; f.t = 0; f.armor = true;
    Aud.gong(); G.shake = 6;
  }
  /* ---- 命中解算 (中央管线: 防御/削减/积气/硬直/击倒) ---- */
  function applyHit(f, o, spec, px) {
    if (o.inv > 0 || o.st === 'ko' || o.st === 'down' || o.st === 'wakeup') return false;
    if (spec.level === 'high' && o.st === 'crouch') return false;          // 蹲避高段
    const guard = wantGuard(o, f);
    const hx = px !== undefined ? px : o.x, hy = GROUND - 84 + rnd(-14, 14);
    if (guard && o.y === 0) {                                              // 防御成立
      o.st = 'block'; o.t = 0; o.stun = spec.bstun;
      const chip = spec.chip || 0;
      if (chip) { o.hp = clamp(o.hp - chip, 0, 100); pushDmg(hx, hy, chip, true); }
      o.x += f.face * spec.push * 0.55;
      o.meter = clamp(o.meter + 3, 0, 100); f.meter = clamp(f.meter + 2, 0, 100);
      F.hitstop = 3; G.shake = 2;
      FX.burst(hx, hy, '#7fd3ff');
      Aud.blip();
      if (o.hp <= 0) { koHappen(f === F.p[0] ? 0 : 1, o); }
      return false;

    const x0 = left ? 78 : W - 78 - bw;
    g.save();
    g.transform(1, 0, left ? -0.22 : 0.22, 1, 0, 0);
    const sk = left ? y * 0.22 : -y * 0.22;
    g.fillStyle = '#1b1420'; g.fillRect(x0 - 4 + sk, y - 4, bw + 8, bh + 8);
    g.fillStyle = '#3a1420'; g.fillRect(x0 + sk, y, bw, bh);
    const pct = f.hp / 100;
    const hg = g.createLinearGradient(0, y, 0, y + bh);
    hg.addColorStop(0, pct > 0.35 ? '#c4f23e' : '#ffb23e'); hg.addColorStop(1, pct > 0.35 ? '#59b32a' : '#e0632a');
    g.fillStyle = hg;
    if (left) g.fillRect(x0 + sk + bw * (1 - pct), y, bw * pct, bh);
    else g.fillRect(x0 + sk, y, bw * pct, bh);
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x0 + sk, y, bw, 5);
    g.restore();
    /* 头像 chip */
    const cx = left ? 30 : W - 62;
    g.fillStyle = '#1b1420'; g.fillRect(cx - 3, 18, 38, 40);
    g.fillStyle = '#4d3a52'; g.fillRect(cx, 21, 32, 34);
    g.save(); g.imageSmoothingEnabled = false;
    if (!left) { g.translate(cx + 32, 0); g.scale(-1, 1); g.drawImage(bank.chip, 0, 22, 32, 30); }
    else g.drawImage(bank.chip, cx, 22, 32, 30);
    g.restore();
    /* 名字+胜场 pip */
    outlineText(g, `${c.en}·${c.cn}`, left ? 200 : W - 200, 78, `bold 15px ${FONT_CN}`, '#fff', '#26102e', 4);
    for (let i = 0; i < 2; i++) {
      const px = left ? 90 + i * 22 : W - 90 - i * 22;
      g.fillStyle = i < f.wins ? '#ffd23e' : 'rgba(255,255,255,.25)';
      g.save(); g.translate(px, 70); g.rotate(Math.PI / 4); g.fillRect(-6, -6, 12, 12); g.restore();
      g.strokeStyle = '#1b1420'; g.lineWidth = 2;
      g.save(); g.translate(px, 70); g.rotate(Math.PI / 4); g.strokeRect(-6, -6, 12, 12); g.restore();
    }
    /* 气槽 */
    const mw = 220, my = 86, mx = left ? 78 : W - 78 - mw;
    g.fillStyle = '#1b1420'; g.fillRect(mx - 3, my - 3, mw + 6, 14);
    g.fillStyle = '#241d33'; g.fillRect(mx, my, mw, 8);
    const mp = f.meter / 100, full = f.meter >= 100;
    const mg = g.createLinearGradient(0, my, 0, my + 8);
    mg.addColorStop(0, full ? '#fff3c4' : '#ff9a3e'); mg.addColorStop(1, full ? '#ffd23e' : '#e0632a');
    g.fillStyle = mg;
    g.fillRect(left ? mx : mx + mw * (1 - mp), my, mw * mp, 8);
    if (full && (G.t / 14 | 0) % 2) outlineText(g, 'MAX!', left ? mx + mw + 30 : mx - 30, my + 10, `bold 14px ${FONT_EN}`, '#ffd23e', '#40230a', 4, true);
    /* 连击计数 */
    if (f.combo >= 2) {
      const cxp = left ? 150 : W - 150;
      g.save(); g.translate(cxp, 150); g.rotate(left ? -0.06 : 0.06);
      outlineText(g, `${f.combo} HITS!`, 0, 0, `bold 34px ${FONT_EN}`, gradFire(g, -26, 4), '#40060e', 9, true);
      g.restore();
    }
  }
  function draw(g) {
    g.save();
    if (G.shake > 0.5) g.translate(rnd(-G.shake, G.shake), rnd(-G.shake / 2, G.shake / 2));
    Stage.draw(g, G.t);
    /* 超必杀暗场 */
    if (F.superFx) {
      g.fillStyle = 'rgba(10,4,16,.62)'; g.fillRect(0, 0, W, H);
      const S = F.superFx, c = CHARS[S.u.ci];
      if (S.t < 26) {
        g.fillStyle = S.t % 4 < 2 ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,0)'; g.fillRect(0, 0, W, H);
        outlineText(g, S.name, 512, 190, `bold 46px ${FONT_CN}`, c.tint, '#1b1020', 10, true);
      }
    }
    drawFighter(g, F.p[0], '1P', '#8aff5e');
    drawFighter(g, F.p[1], '2P', '#ffab3e');
    drawProjs(g);
    FX.draw(g);
    drawDmgNums(g);
    g.restore();
    /* HUD */
    hpBar(g, F.p[0], true);
    hpBar(g, F.p[1], false);
    /* 计时牌 (训练场显示 ∞) */
    g.fillStyle = '#1b1420'; g.fillRect(512 - 42, 14, 84, 56);
    g.fillStyle = '#f2ead0'; g.fillRect(512 - 36, 20, 72, 44);
    g.fillStyle = '#8f3320'; g.fillRect(512 - 36, 20, 72, 6);
    outlineText(g, F.training ? '∞' : String(F.timer).padStart(2, '0'), 512, 58, `bold 34px ${FONT_EN}`, '#26202e', '#f2ead0', 0);
    /* ARCADE 梯队进度 */
    if (F.ladder) outlineText(g, `STAGE ${F.ladder.idx + 1}/${F.ladder.order.length} · ${F.ladder.tiers[F.ladder.idx].toUpperCase()}`, 512, 86, `bold 13px ${FONT_EN}`, '#ffe9a8', '#26102e', 4);
    /* 横幅 */
    if (F.phase === 'round' || F.phase === 'go' || F.phase === 'ko') {
      /* 横幅深色衬底 */
      g.fillStyle = 'rgba(16,8,20,.55)'; g.fillRect(0, 216, W, 118);
      g.fillStyle = 'rgba(255,210,62,.9)'; g.fillRect(0, 216, W, 3); g.fillRect(0, 331, W, 3);
    }
    if (F.phase === 'round') {
      const k = clamp(F.pt / 16, 0, 1);
      g.save(); g.translate(512, 268); g.scale(0.6 + k * 0.4, 0.6 + k * 0.4); g.globalAlpha = k;
      outlineText(g, 'ROUND', -46, 16, `bold 62px ${FONT_EN}`, (gg => { const t = gg.createLinearGradient(0, -40, 0, 16); t.addColorStop(0, '#f6ff6e'); t.addColorStop(1, '#59d96e'); return t; })(g), '#0d1408', 12, true);
      outlineText(g, String(F.round), 158, 22, `bold 88px ${FONT_EN}`, gradFire(g, -50, 24), '#40060e', 12, true);
      g.restore();
    } else if (F.phase === 'go') {
      const k = 1 - F.pt / 40;
      g.save(); g.globalAlpha = Math.min(1, k * 3); g.translate(512, 278); g.scale(1 + (1 - k) * 0.35, 1 + (1 - k) * 0.35);
      outlineText(g, 'FIGHT !', 0, 20, `bold 84px ${FONT_EN}`, gradFire(g, -56, 22), '#40060e', 14, true);
      g.restore();
    } else if (F.phase === 'ko') {
      const k = clamp(F.pt / 12, 0, 1);
      g.save(); g.translate(512, 286); g.scale(2.2 - k * 1.2, 2.2 - k * 1.2);
      outlineText(g, 'K.O.', 0, 26, `bold 110px ${FONT_EN}`, gradFire(g, -70, 30), '#2a0408', 16, true);
      g.restore();
    } else if (F.phase === 'next') {
      g.fillStyle = 'rgba(16,8,20,.82)'; g.fillRect(0, 0, W, H);
      const nc = CHARS[F.ladder.order[F.ladder.idx + 1]];
      const nb = Baker.bank[nc.id];
      outlineText(g, 'NEXT  FIGHT', 512, 140, `bold 52px ${FONT_EN}`, (gg => { const t = gg.createLinearGradient(0, 96, 0, 144); t.addColorStop(0, '#f6ff6e'); t.addColorStop(1, '#59d96e'); return t; })(g), '#0d1408', 12, true);
      g.save(); g.translate(512, 440); g.scale(-2.5, 2.5); g.imageSmoothingEnabled = false;
      g.drawImage(nb.idle[((G.t / 26) | 0) % 2], -48, -112);
      g.restore();
      outlineText(g, `${nc.en}·${nc.cn}`, 512, 486, `bold 26px ${FONT_CN}`, '#fff', '#26102e', 6);
      outlineText(g, `${nc.joke} · ${nc.title}`, 512, 518, `bold 17px ${FONT_CN}`, '#ffe9a8', '#4a2a08', 5);
      outlineText(g, `STAGE ${F.ladder.idx + 2}`, 512, 200, `bold 22px ${FONT_EN}`, '#ffab3e', '#26102e', 6, true);
    } else if (F.phase === 'result' || F.phase === 'gameover' || F.phase === 'clear') {
      g.fillStyle = 'rgba(16,8,20,.78)'; g.fillRect(0, 0, W, H);
      const wf = F.p[F.winner], c = CHARS[wf.ci];
      const bank = Baker.bank[c.id];
      if (F.phase === 'gameover') {
        outlineText(g, 'GAME OVER', 512, 250, `bold 74px ${FONT_EN}`, gradFire(g, 190, 256), '#2a0408', 14, true);
        outlineText(g, `倒在 STAGE ${F.ladder.idx + 1} · ${CHARS[F.p[1].ci].cn} 之手`, 512, 300, `bold 20px ${FONT_CN}`, '#fff', '#26102e', 5);
      } else {
        g.save(); g.translate(512, 494); g.scale(2, 2); g.imageSmoothingEnabled = false;
        g.drawImage(((G.t / 20) | 0) % 2 ? bank.win : bank.idle[1], -48, -112);
        g.restore();
        if (F.phase === 'clear') {
          outlineText(g, 'ARCADE  CLEAR !', 512, 150, `bold 56px ${FONT_EN}`, (gg => { const t = gg.createLinearGradient(0, 100, 0, 156); t.addColorStop(0, '#fff3c4'); t.addColorStop(1, '#ffd23e'); return t; })(g), '#40230a', 14, true);
          outlineText(g, `${c.en}·${c.cn} 制霸天下第一武道大会`, 512, 198, `bold 24px ${FONT_CN}`, '#fff', '#26102e', 6);
          outlineText(g, `五连胜 · 获得新称号「${c.title}·真」`, 512, 234, `bold 19px ${FONT_CN}`, '#ffe9a8', '#4a2a08', 5);
        } else {
          outlineText(g, 'WINNER', 512, 150, `bold 66px ${FONT_EN}`, (gg => { const t = gg.createLinearGradient(0, 96, 0, 152); t.addColorStop(0, '#fff3c4'); t.addColorStop(1, '#ffd23e'); return t; })(g), '#40230a', 14, true);
          outlineText(g, `${F.winner === 0 ? '1P' : G.mode === 'vs' ? '2P' : 'CPU'} · ${c.en}·${c.cn}`, 512, 196, `bold 26px ${FONT_CN}`, '#fff', '#26102e', 6);
          outlineText(g, c.title, 512, 232, `bold 20px ${FONT_CN}`, '#ffe9a8', '#4a2a08', 5);
        }
      }
      if ((G.t / 30 | 0) % 2) outlineText(g, '按 J 返回标题', 512, 556, `bold 18px ${FONT_CN}`, '#8aff9e', '#0d1408', 5);
      FX.draw(g);
      if (F.phase !== 'gameover' && F.pt % 34 === 0) FX.confetti(rnd(200, 824), rnd(80, 200));
    }
    /* 训练场出招表 (H 开关) */
    if (F.training && F.showMoves && F.phase === 'play') {
      g.fillStyle = 'rgba(16,8,20,.82)'; g.fillRect(18, 110, 330, 232);
      g.strokeStyle = '#8aff5e'; g.lineWidth = 2; g.strokeRect(18, 110, 330, 232);
      const kit = KIT[cidOf(F.p[0])];
      const rows = [
        ['移动 / 下蹲 / 跳', 'A D / S / W'],
        ['轻击 (蹲下=下段)', 'J'],
        ['重击 (击倒)', 'K'],
        ['必杀·' + kit.sp.name, 'U'],
        ['超必杀·' + kit.super.name, 'I (气满)'],
        ['冲刺 / 后闪', '双击 A / D'],
        ['防御', '按住后方向'],
        ['连段取消', '命中后接 K/U/I'],
        ['出招表开关', 'H'],
      ];
      g.textAlign = 'left'; g.font = `bold 14px ${FONT_CN}`;
      rows.forEach((r, i) => {
        g.fillStyle = '#8aff9e'; g.fillText(r[0], 32, 138 + i * 23);
        g.fillStyle = '#ffe9a8'; g.fillText(r[1], 218, 138 + i * 23);
      });
    }
    /* 底部按键提示 */
    if (F.phase === 'play') {
      g.fillStyle = 'rgba(20,10,24,.55)'; g.fillRect(0, H - 26, W, 26);
      g.fillStyle = 'rgba(255,255,255,.75)'; g.font = `13px ${FONT_CN}`; g.textAlign = 'center';
      g.fillText(F.training
        ? 'WASD J轻 K重 U必杀 I超必 · 双击AD冲刺 · 后拉防御 · H 出招表 · ESC 退出'
        : G.mode === 'vs'
          ? 'P1: WASD + J轻 K重 U必 I超 · P2: 方向键 + ,轻 .重 /必 右Shift超 · ESC 退出'
          : 'WASD移动/跳/蹲 · J轻 K重 U必杀 I超必(气满) · 双击AD冲刺 · 后拉防御 · ESC 退出', 512, H - 8);
    }
  }
  return { enter, update, draw, get F() { return F; } };
})();

/* ================= 主循环 ================= */
Baker.bakeAll();
Title.enter();
function frame() {
  G.t++;
  FX.update();
  if (G.screen === 'title') Title.update();
  else if (G.screen === 'select') Select.update();
  else if (G.screen === 'fight') Fight.update();
  Input.flush();
  CX.clearRect(0, 0, W, H);
  if (G.screen === 'title') Title.draw(CX);
  else if (G.screen === 'select') Select.draw(CX);
  else if (G.screen === 'fight') Fight.draw(CX);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
